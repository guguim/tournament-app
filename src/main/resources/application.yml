spring:
  application:
    name: tournament-engine
  
  datasource:
    url: jdbc:postgresql://localhost:5432/tournament_db
    username: tournament_user
    password: tournament_password
  
  jpa:
    hibernate:
      # O Hibernate NÃO deve criar/alterar tabelas. O Flyway é o chefe agora!
      ddl-auto: validate 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Se o banco já existisse antes do flyway, ele faria um baseline seguro
    baseline-on-migrate: true 
